name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  VSCODE_VERSION: 1.138.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.3, 24.21.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  coverage:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate coverage
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          flags: node
          name: node-tests
          fail_ci_if_error: true

  vscode-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:vscode-web
      - run: pnpm test:userscript-browser
      - run: pnpm test:vscode-web:vsix

  static-web:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:web-static:extensions

      - name: Check out matching Code-OSS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vscode
          ref: ${{ env.VSCODE_VERSION }}
          path: .vscode-web-source
          persist-credentials: false

      - name: Isolate Code-OSS build from workspace dependencies
        run: cp -a .vscode-web-source "$RUNNER_TEMP/vscode-source"

      - name: Use Code-OSS build Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ${{ runner.temp }}/vscode-source/package-lock.json

      - name: Install Code-OSS native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libkrb5-dev libsecret-1-dev libx11-dev libxkbfile-dev

      - name: Install Code-OSS dependencies
        working-directory: ${{ runner.temp }}/vscode-source
        run: npm ci

      - name: Build minified Code-OSS web assets
        working-directory: ${{ runner.temp }}/vscode-source
        run: |
          npm run gulp copy-codicons compile-web-extensions-build
          mkdir -p .build/extensions
          cp -a .build/web/extensions/. .build/extensions/
          node build/next/index.ts bundle --minify --nls --target server-web --out out-vscode-reh-web-min

      - name: Smoke test static assembly against Code-OSS output
        run: node --test tests/meta/static-web.test.mjs
        env:
          VSCODE_WEB_BUILD: ${{ runner.temp }}/vscode-source

  github-public:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:github-live
