name: Deploy PR to staging

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy
        required: true
        type: string

concurrency:
  group: remotish-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      cosw_tag: ${{ steps.cosw.outputs.tag }}
    steps:
      - name: Resolve selected PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "PR number must be a positive integer." >&2
            exit 1
          fi

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if [[ "$(jq -r '.state' <<<"$pr")" != 'open' ]]; then
            echo "PR #$PR_NUMBER is not open." >&2
            exit 1
          fi

          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          test -n "$head_sha"
          test "$head_repo" != 'null'

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"
          echo "Selected PR #$PR_NUMBER at $head_sha from $head_repo."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: source
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Build PR browser extensions
        run: |
          pnpm --dir source install --frozen-lockfile
          pnpm --dir source bundle:demo
          pnpm --dir source bundle:fixture-provider:extension
          pnpm --dir source bundle:browser-rpc-provider:extension
          pnpm --dir source bundle:github-provider:extension
          pnpm --dir source bundle:git-http-provider:extension

      - name: Resolve matching Code-OSS Static Web release
        id: cosw
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          code_oss_version="$(node --print "require('./source/package.json').codeOss.version")"
          releases="$(gh api --paginate --slurp 'repos/HRAshton/code-oss-static-web/releases?per_page=100')"
          release="$(
            jq -c --arg version "$code_oss_version" '
              [
                .[][]
                | select(.draft == false and .prerelease == false)
                | . as $release
                | (.tag_name | capture("^v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)-web\\.(?<revision>[0-9]+)$")) as $tag
                | select($tag.version == $version)
                | { release: $release, revision: ($tag.revision | tonumber) }
              ]
              | sort_by(.revision)
              | last
              | .release // empty
            ' <<<"$releases"
          )"

          if [[ -z "$release" ]]; then
            echo "No released Code-OSS Static Web build matches Code-OSS $code_oss_version." >&2
            exit 1
          fi

          tag="$(jq -r '.tag_name' <<<"$release")"
          asset_name="code-oss-static-web-${tag#v}.tar.gz"
          asset="$(jq -c --arg name "$asset_name" '.assets[] | select(.name == $name)' <<<"$release")"
          if [[ -z "$asset" ]]; then
            echo "Release $tag does not contain $asset_name." >&2
            exit 1
          fi

          asset_url="$(jq -r '.browser_download_url' <<<"$asset")"
          digest="$(jq -r '.digest // empty' <<<"$asset")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Release asset $asset_name does not expose a SHA-256 digest." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Using $tag for Code-OSS $code_oss_version."

      - name: Assemble staging distribution
        env:
          COSW_URL: ${{ steps.cosw.outputs.asset_url }}
          COSW_DIGEST: ${{ steps.cosw.outputs.digest }}
          COSW_TAG: ${{ steps.cosw.outputs.tag }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work staging
