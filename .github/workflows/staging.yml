name: Deploy PR to staging

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy
        required: true
        type: string
      fixture_provider:
        description: Include fixture provider
        required: true
        default: true
        type: boolean
      browser_rpc_provider:
        description: Include browser RPC provider
        required: true
        default: true
        type: boolean
      github_provider:
        description: Include GitHub provider
        required: true
        default: true
        type: boolean
      git_http_provider:
        description: Include Git HTTP provider
        required: true
        default: true
        type: boolean

concurrency:
  group: remotish-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      cosw: ${{ steps.cosw.outputs.tag }}
      extensions: ${{ steps.extensions.outputs.summary }}
    steps:
      - name: Authorize staging deployment
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Run staging from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi

          if [[ "$GITHUB_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo "Only the repository owner ($REPOSITORY_OWNER) may approve a shared-origin staging deployment." >&2
            exit 1
          fi

      - name: Resolve trusted PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "PR number must be a positive integer." >&2; exit 1; }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r .state <<<"$pr")" == open ]] || { echo "PR #$PR_NUMBER is not open." >&2; exit 1; }

          head_repo="$(jq -r .head.repo.full_name <<<"$pr")"
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "Fork PRs cannot be deployed to shared-origin staging: $head_repo." >&2
            exit 1
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "repo=$head_repo" >> "$GITHUB_OUTPUT"

      - name: Check out trusted staging tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out selected PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: source
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Select staging extensions
        id: extensions
        env:
          FIXTURE: ${{ inputs.fixture_provider }}
          BROWSER_RPC: ${{ inputs.browser_rpc_provider }}
          GITHUB_PROVIDER: ${{ inputs.github_provider }}
          GIT_HTTP: ${{ inputs.git_http_provider }}
        run: |
          set -euo pipefail
          providers=()
          [[ "$FIXTURE" == true ]] && providers+=(fixture-provider)
          [[ "$BROWSER_RPC" == true ]] && providers+=(browser-rpc-provider)
          [[ "$GITHUB_PROVIDER" == true ]] && providers+=(github-provider)
          [[ "$GIT_HTTP" == true ]] && providers+=(git-http-provider)

          {
            printf 'providers='
            printf '%s ' "${providers[@]}"
            printf '\n'
          } >> "$GITHUB_OUTPUT"

          summary="hrashton.remotish"
          for provider in "${providers[@]}"; do
            summary+=", hrashton.remotish-${provider}"
          done
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Build selected browser extensions
        env:
          PROVIDERS: ${{ steps.extensions.outputs.providers }}
        run: |
          set -euo pipefail
          pnpm --dir source install --frozen-lockfile
          pnpm --dir source bundle:demo

          for provider in $PROVIDERS; do
            case "$provider" in
              fixture-provider) pnpm --dir source bundle:fixture-provider:extension ;;
              browser-rpc-provider) pnpm --dir source bundle:browser-rpc-provider:extension ;;
              github-provider) pnpm --dir source bundle:github-provider:extension ;;
              git-http-provider) pnpm --dir source bundle:git-http-provider:extension ;;
              *) echo "Unknown provider: $provider" >&2; exit 1 ;;
            esac
          done

      - name: Resolve matching COSW release
        id: cosw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node --print "require('./source/package.json').codeOss.version")"
          prefix="v${version}-web."
          release="$(gh api 'repos/HRAshton/code-oss-static-web/releases?per_page=100' | jq -c --arg prefix "$prefix" '[.[] | select(.draft == false and .prerelease == false) | select(.tag_name | startswith($prefix)) | . + {_revision: (try (.tag_name | split("-web.")[1] | tonumber) catch -1)} | select(._revision >= 0)] | sort_by(._revision) | last // empty')"
          [[ -n "$release" ]] || { echo "No COSW release matches Code-OSS $version." >&2; exit 1; }
          tag="$(jq -r .tag_name <<<"$release")"
          name="code-oss-static-web-${tag#v}.tar.gz"
          asset="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release")"
          [[ -n "$asset" ]] || { echo "$tag does not contain $name." >&2; exit 1; }
          digest="$(jq -r '.digest // empty' <<<"$asset")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "$name has no SHA-256 digest." >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .browser_download_url <<<"$asset")" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Assemble staging site
        env:
          COSW_URL: ${{ steps.cosw.outputs.url }}
          COSW_DIGEST: ${{ steps.cosw.outputs.digest }}
          COSW_TAG: ${{ steps.cosw.outputs.tag }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          PROVIDERS: ${{ steps.extensions.outputs.providers }}
          EXTENSIONS: ${{ steps.extensions.outputs.summary }}
        run: |
          set -euo pipefail
          mkdir -p .work staging
          curl --fail --location --silent --show-error "$COSW_URL" -o .work/cosw.tar.gz
          echo "${COSW_DIGEST#sha256:}  .work/cosw.tar.gz" | sha256sum -c -
          tar -xzf .work/cosw.tar.gz -C staging
          # shellcheck disable=SC2086
          node tooling/scripts/prepare-static-preview.mjs staging source $PROVIDERS
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg sha "$PR_SHA" \
            --arg cosw "$COSW_TAG" \
            --arg extensions "$EXTENSIONS" \
            '{pullRequest: ($pr | tonumber), headSha: $sha, codeOssStaticWebRelease: $cosw, extensions: ($extensions | split(", "))}' \
            > staging/remotish-staging.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Update PR with staging link
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.build.outputs.pr }}
          HEAD_SHA: ${{ needs.build.outputs.sha }}
          COSW_TAG: ${{ needs.build.outputs.cosw }}
          EXTENSIONS: ${{ needs.build.outputs.extensions }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:7}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="<!-- remotish-staging-preview -->
          Staging was updated from this PR at \`$short\` using \`$COSW_TAG\`.

          Extensions: $EXTENSIONS

          [Open staging]($PAGE_URL) · [deployment run]($run_url)

          This is one shared staging environment; a later manual deployment may replace it."
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- remotish-staging-preview -->")) | .id' | tail -n1)"
          if [[ -n "$id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
          printf '### Remotish staging\n\n- PR: #%s (`%s`)\n- COSW: `%s`\n- Extensions: %s\n- URL: %s\n' "$PR_NUMBER" "$short" "$COSW_TAG" "$EXTENSIONS" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
