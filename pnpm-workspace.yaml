packages:
  - 'packages/*'
  - 'adapters/*'
  - 'apps/*'
  - 'extensions/*'

# pnpm is pinned by packageManager and CI; keep the lockfile focused on project dependencies.
pmOnFail: ignore
includeWorkspaceRoot: true
allowBuilds:
  '@playwright/browser-chromium': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: false

minimumReleaseAge: 1440 # Require external releases to age for 24 hours before normal installation.
